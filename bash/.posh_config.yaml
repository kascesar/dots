$schema: "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
version: 3

blocks:
  - type: "prompt"
    alignment: "left"
    segments:
      - type: "path"
        style: "diamond"
        template: "<cyan>\u256d\u2500</>{{ .Path }}<cyan></>"
        properties:
          folder_icon: "\uf07b"
          home_icon: "\ue617"
          style: agnoster
          folder_separator_icon: "<cyan></>"
      - type: git
        style: diamond
        template: >-
          <cyan>-</>
          {{ .UpstreamIcon }}
          {{ .HEAD }}
          {{ if .BranchStatus }}{{ .BranchStatus }}{{ end }}
          {{ if .Working.Changed }}<red></>{{ .Working.String }}{{ end }}
          {{ if and .Working.Changed .Staging.Changed }}<magenta>|</>{{ end }}
          {{ if and (not .Working.Changed) .Staging.Changed }}<magenta>|</>{{ end }}
          {{ if .Staging.Changed }}<green></>{{ .Staging.String }}{{ end }}
          {{ if gt .StashCount 0 }}{{ .StashCount }}{{ end }}
          <cyan></>
        properties:
          fetch_status: true
          fetch_upstream_icon: true
          git_icon: ""
          codecommit_icon: 󰸏
          branch_icon: ""
          untracked_modes:
            /Users/user/Projects/oh-my-posh/: no
          source: cli
          mapped_branches:
            feat/*: "🚀 feat/"
            feature/*: "🚀 feature/"
            bug/*: "🐛 bug/"
            bugfix/*: "🐛 bugfix/"
            hotfix/*: "🧯 hotfix/" 
  - type: "prompt"
    alignment: "left"
    overflow: hide
    segments:
      - type: "python"
        style: "diamond"
        template: >-
          <cyan>-</>
           {{ if .Venv }}{{ .Venv }}{{ end }}
          <cyan></>
        properties:
          display_mode: environment
          fetch_virtual_env: true
          folder_name_fallback: true
          default_venv_names: [".venv", "venv"]
          home_enabled: true

  - type: "prompt"
    alignment: "right"
    overflow: hide
    segments:
      - type: "aws"
        style: diamond
        template: >- 
          <cyan></>
          󰸏 {{.Profile}}{{if .Region}} {{.Region}}{{end}}
          <cyan></>

  - type: "prompt"
    alignment: "left"
    newline: true
    segments:
      - type: "text"
        style: "plain"
        template: "<cyan>\u2570\u2500</>"

      - type: "status"
        style: "plain"
        template: "<cyan>◉→</> "
        foreground: "#e0f8ff"
        foreground_templates:
          - "{{ if gt .Code 0 }}#ef5350{{ end }}"
        properties:
          always_enabled: true

